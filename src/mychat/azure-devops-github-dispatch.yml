trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      set -euo pipefail

      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is not configured as a secret pipeline variable."
        exit 1
      fi

      curl --fail --silent --show-error \
        --request POST \
        --url https://api.github.com/repos/hraverkar/LLM-Chat-Cli/dispatches \
        --header "Accept: application/vnd.github+json" \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --data '{"event_type":"azure_devops_sync"}'
    displayName: 'Trigger GitHub Actions sync'
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
